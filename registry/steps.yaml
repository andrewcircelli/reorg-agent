# Step Registry — the source of truth for what a reorg requires and in what order.
#
# This file is the checklist that used to live in someone's head. It is versioned, diffable, and
# reviewed like code. Adding a system or a rule is an edit here, not an edit to an agent prompt.
#
# Each step: id · system · applies_to (change kinds that trigger it) · actuator (api | human_keyed)
#            · requires (must complete first) · deadline · verify (check run after the step)
#
# ⚠ The edge  hris.reassign_workers.requires: finance.map_gl  prevents the error the problem
#   statement describes: cost posting to a cost center with no GL mapping, found weeks later at close.
#   tests/test_registry.py detects its removal.
#
# Supported kind: COST_CENTER_SPLIT.
# Extension (planned kinds, not built): COMP_CHANGE adds hris.update_comp and a Comp/HR approver;
# TEAM_MOVE adds hris.move_supervisory_org and a planning-tool
# headcount step; MANAGER_CHANGE adds hris.change_manager; COST_CENTER_MERGE adds
# finance.close_old_cost_center. Each is an entry here plus a field spec in reorg/contracts.py.

version: 1

steps:
  - id: finance.create_cost_center
    system: finance
    applies_to: [COST_CENTER_SPLIT]
    actuator: api
    requires: []
    verify: cost_center_exists(target_cc)
    description: Create the new cost center in the chart of accounts.

  - id: finance.map_gl
    system: finance
    applies_to: [COST_CENTER_SPLIT]
    actuator: human_keyed          # no API — a person keys it in; verify runs after "done"
    requires: [finance.create_cost_center]
    deadline: before_first_payroll_posting(effective_date)
    verify: gl_mapping_exists(target_cc)
    description: Map the new cost center to GL accounts (mirror the source cost center's mapping).

  - id: hris.reassign_workers
    system: hris
    applies_to: [COST_CENTER_SPLIT]
    actuator: api
    requires: [finance.create_cost_center, finance.map_gl]
    verify: all(worker.cost_center == target_cc for worker in team)
    description: Move each worker on the team to the new cost center, effective on the effective date.

  - id: finance.update_reporting_hierarchy
    system: finance
    applies_to: [COST_CENTER_SPLIT]
    actuator: api
    requires: [finance.map_gl]
    deadline: before_period_close(effective_date)
    verify: rollup_parent(target_cc) == rollup_parent(source_cc)
    description: Add the new cost center to the consolidation rollup so period reports reflect the split.
